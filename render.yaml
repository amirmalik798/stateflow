services:
  - type: web
    name: stateflow
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stateflow-free-db
          property: connectionString
      - key: PG_POOL_SIZE
        value: "4"
      - key: PG_SSL
        value: "false"
      - key: STATEFLOW_LOGIN_ID
        value: "owner"
      - key: STATEFLOW_LOGIN_PASSWORD
        sync: false
